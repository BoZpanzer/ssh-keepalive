name: Build Windows EXE + Android APK Release

on:
  push:
    branches: [main, feature/release-android-and-windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish windows/SSHKeepAlive.Windows/SSHKeepAlive.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
      - name: Smoke-test and checksum
        shell: pwsh
        run: |
          $exe = 'dist/SSHKeepAlive.Windows.exe'
          if (!(Test-Path $exe)) { throw "Missing EXE: $exe" }
          $test = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Smoke test failed with exit code $($test.ExitCode)" }
          Rename-Item -Path $exe -NewName 'SSH-KeepAlive.exe'
          $hash = (Get-FileHash dist/SSH-KeepAlive.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SSH-KeepAlive.exe" | Set-Content dist/SHA256-Windows.txt -Encoding ascii
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/SSH-KeepAlive.exe
            dist/SHA256-Windows.txt
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cp app/build/outputs/apk/release/app-release.apk dist-android/SSH-KeepAlive.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose dist-android/SSH-KeepAlive.apk
          (cd dist-android && sha256sum SSH-KeepAlive.apk > SHA256-Android.txt)
          ls -lh dist-android/
      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist-android/SSH-KeepAlive.apk
            dist-android/SHA256-Android.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish both binaries in one GitHub Release
    needs: [windows, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows
      - name: Download Android binary
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release/android
      - name: Check both binary files
        run: |
          test -s release/windows/SSH-KeepAlive.exe
          test -s release/android/SSH-KeepAlive.apk
          ls -lh release/{windows,android}/
      - name: Create GitHub Release with EXE and APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="release-$GITHUB_RUN_NUMBER"
          gh release create "$tag" \
            release/windows/SSH-KeepAlive.exe \
            release/windows/SHA256-Windows.txt \
            release/android/SSH-KeepAlive.apk \
            release/android/SHA256-Android.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH KeepAlive – Windows + Android ($tag)" \
            --notes "Windows: standalone x64 EXE (unsigned). Android: APK for Android 8+ (signed with CI debug signing key; uninstall a previous differently signed APK before installing). Both are built from the same commit. Windows smoke test and APK signature verification passed. Live StudNET connectivity has not been tested." \
            --latest
