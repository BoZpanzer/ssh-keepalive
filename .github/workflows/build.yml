name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Lokaler OpenSSH-Server für die echten Verbindungstests (SshIntegrationTest)
      - name: Lokalen SSH-Testserver einrichten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server >/dev/null
          printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\nUsePAM yes\n' | sudo tee /etc/ssh/sshd_config.d/00-keepalive-test.conf
          sudo useradd -m -s /bin/bash testuser
          echo 'testuser:Kp-Test-2026!' | sudo chpasswd
          echo 'echo KEEPALIVE-TEST-OK' | sudo tee -a /home/testuser/.profile >/dev/null
          sudo systemctl restart ssh || sudo service ssh restart
          FPS=$(for f in /etc/ssh/ssh_host_*_key.pub; do ssh-keygen -lf "$f" | awk '{print $2}'; done | paste -sd, -)
          echo "Hostkey-Fingerprints: $FPS"
          echo "SSH_TEST_FPS=$FPS" >> "$GITHUB_ENV"

      - name: Tests + APK bauen
        env:
          SSH_TEST_HOST: 127.0.0.1
          SSH_TEST_USER: testuser
          SSH_TEST_PASS: "Kp-Test-2026!"
          SSH_TEST_CAN_KILL: "1"
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log

      - name: APK prüfen
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for v in release debug; do
            APK=$(ls app/build/outputs/apk/$v/*.apk 2>/dev/null | head -1)
            [ -n "$APK" ] || continue
            if [ "$v" = release ]; then cp "$APK" out/SSH-KeepAlive.apk; else cp "$APK" out/SSH-KeepAlive-debug.apk; fi
            {
              echo "== $v: $APK"; ls -l "$APK"; sha256sum "$APK"
              "$BT/apksigner" verify --verbose --print-certs "$APK"
              "$BT/aapt2" dump badging "$APK" | head -40
            } >> out/verify.txt 2>&1 || true
          done
          if [ -d app/build/test-results ]; then
            python3 - <<'EOF' > out/tests.txt
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('app/build/test-results/**/*.xml', recursive=True)):
              r = ET.parse(f).getroot()
              print(f"{r.get('name')}: tests={r.get('tests')} failures={r.get('failures')} errors={r.get('errors')} skipped={r.get('skipped')}")
              for tc in r.iter('testcase'):
                  st = 'FAIL' if tc.find('failure') is not None or tc.find('error') is not None else ('SKIP' if tc.find('skipped') is not None else 'OK')
                  print(f"  [{st}] {tc.get('name')} ({tc.get('time')}s)")
                  for x in list(tc.findall('failure')) + list(tc.findall('error')):
                      print('    ' + (x.get('message') or '')[:500])
              so = r.find('system-out')
              if so is not None and so.text: print('  stdout:\n    ' + so.text.strip().replace('\n', '\n    ')[:3000])
          EOF
          fi
          ls -l out

      # Ergebnisse auf den Branch "build-output" legen (einfach per git abholbar)
      - name: Ergebnisse veröffentlichen
        if: always()
        run: |
          cd out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "${{ github.sha }} ${{ job.status }}" > COMMIT.txt
          git add -A
          git commit -q -m "Build ${{ github.run_number }} für ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SSH-KeepAlive
          path: out/
